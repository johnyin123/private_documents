server {
    listen 80;
    server_name example.com;
    root /var/www/cache;
    location / {
        # 1. Try serving the full file from local disk first
        try_files $uri @fetch;
    }
    location @fetch {
        # 2. Forward the client's original Range request directly to the backend
        proxy_pass http://backend_upstream;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        # 3. Trigger a background subrequest to download and store the full file
        mirror /mirror_store;
        mirror_request_body off;
    }
    location = /mirror_store {
        internal;
        # Force GET so HEAD requests still trigger a full file download to disk
        proxy_method GET;
        # Use the original request URI so proxy_store saves to the right path
        proxy_pass http://backend_upstream$request_uri;
        # 4. Strip Range headers so the backend returns HTTP 200 instead of 206
        proxy_set_header Range "";
        proxy_set_header If-Range "";
        # 5. Save the full HTTP 200 response to disk
        proxy_store on;
        proxy_store_access user:rw group:rw all:r;
        # Ensure the file is saved under the exact original URI path
        alias /var/www/cache$request_uri;
        # Prevent client disconnects from aborting the background download
        proxy_ignore_client_abort on;
    }
}
